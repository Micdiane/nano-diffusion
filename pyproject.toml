[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-diffusion-study"
version = "0.2.0"
description = "A small, readable pretrained SANA inference engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch>=2.6", "diffusers==0.37.0", "transformers==5.12.1", "accelerate>=1", "safetensors", "sentencepiece", "pillow", "ftfy"]

[project.urls]
Repository = "https://github.com/Micdiane/nano-diffusion"

[project.scripts]
nano-diffusion = "nanodiffusion.cli:main"

[tool.setuptools.packages.find]
include = ["nanodiffusion*"]
